<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydrokraft GLC Dealer Portal — Prototype</title>
<style>
:root{
  --pri:#1D4F7C;--pri-d:#163D61;--pri-l:#E8F0F7;
  --acc:#B45309;--acc-l:#F5B872;
  --bg:#F3F5F8;--card:#FFFFFF;--line:#D8DEE6;--line-l:#E9EDF2;
  --text:#18222E;--mut:#566373;--side:#12283D;
  --ok:#1A7340;--ok-l:#E6F4EC;--warn:#8A5300;--warn-l:#FFF4DC;--bad:#B3261E;--bad-l:#FDECEA;
  --vio:#5B3FA6;--vio-l:#EFEAFB;--teal:#0B6B74;--teal-l:#E0F3F5;--grey-l:#EEF1F5;
  --r:6px;
}
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:700}
h2{font-size:16px;line-height:1.35;margin:0 0 12px;font-weight:600}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
p{margin:0 0 12px}
a{color:var(--pri);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid #F5B872;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:600}.r{text-align:right}.nw{white-space:nowrap}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:-9999px;top:0;background:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--grey-l);text-decoration:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.danger{color:var(--bad);border-color:#E3B5B1}
.btn.danger:hover{background:var(--bad-l)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pri)}
.btn.ghost:hover{background:var(--pri-l)}
.btn.s{min-height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#C9D5E1;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.brand{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center;color:#fff}
.logo{width:34px;height:34px;border-radius:var(--r);background:linear-gradient(135deg,#DDE4EA,#8FA0B1);color:var(--side);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.brand b{display:block;font-size:14.5px;line-height:1.2}
.brand span{font-size:12px;color:#9FB1C3}
.nav{padding:12px 0;flex:1}
.nav .grp{padding:8px 16px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#8FA3B7}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#C9D5E1;border-left:3px solid transparent;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
.nav a.on{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--acc-l)}
.nav .cnt{margin-left:auto;background:var(--acc);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700;min-width:20px;text-align:center}
.side .who{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px}
.side .who b{display:block;color:#fff;font-size:13.5px}
.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:5}
.top .area{font-weight:600}
.top .sp{flex:1}
.hamb{display:none}
.page{padding:24px;max-width:1280px;margin:0 auto}
.phd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.phd .sub{color:var(--mut);margin:2px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.crumb a{color:var(--mut)}.crumb span{margin:0 6px}

/* Cards / grid */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card.np{padding:0}
.card .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-l)}
.card .ch h2{margin:0}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.g11{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--text);display:block;border-top:3px solid var(--pri)}
a.kpi:hover{text-decoration:none;border-color:var(--pri);background:var(--pri-l)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .x{font-size:12.5px;color:var(--pri);margin-top:2px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* Tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;padding:10px 12px;background:#F8FAFC;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line-l);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t th.r,.t td.r{text-align:right}
.t tr.lnk{cursor:pointer}
.t tr.lnk:hover td{background:var(--pri-l)}
.t tfoot td{background:#F8FAFC;font-weight:600}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge svg.ic{width:13px;height:13px;vertical-align:0}
.s0{background:var(--grey-l);color:#3C4A5A;border-color:#CCD4DD}
.s1{background:var(--pri-l);color:var(--pri);border-color:#B9CFE3}
.s2{background:var(--warn-l);color:var(--warn);border-color:#EBD08F}
.s3{background:var(--vio-l);color:var(--vio);border-color:#CFC3EE}
.s4{background:var(--teal-l);color:var(--teal);border-color:#A9D9DE}
.s5{background:var(--ok-l);color:var(--ok);border-color:#AED9BF}
.sx{background:var(--bad-l);color:var(--bad);border-color:#F0BDB8}

/* Forms */
.field{margin-bottom:14px}
.field label,.lab{display:block;font-weight:600;margin-bottom:4px;font-size:13.5px}
.req{color:var(--bad)}.opt{color:var(--mut);font-weight:400}
input[type=text],input[type=password],input[type=email],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid #AEB8C4;border-radius:var(--r);font:inherit;color:var(--text);background:#fff}
textarea{resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--pri)}
input:focus,select:focus,textarea:focus{outline:3px solid #F5B872;outline-offset:1px;border-color:var(--pri)}
input[readonly]{background:var(--grey-l);color:var(--mut)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--bad);background:#FFF8F7}
.field .msg{color:var(--bad);font-size:12.5px;margin-top:4px;font-weight:600}
.hint{color:var(--mut);font-size:12.5px;margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.chk{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;font-weight:500}
.chk input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--pri)}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:600;font-size:15px;padding:0;margin-bottom:10px}
.sect{border-top:1px solid var(--line-l);padding-top:16px;margin-top:6px}
.upl{border:1.5px dashed #AEB8C4;border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#FAFBFC}

/* Alerts */
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);border:1px solid;margin-bottom:16px;align-items:flex-start}
.alert svg.ic{margin-top:3px}
.alert.info{background:var(--pri-l);border-color:#B9CFE3;color:#143A5C}
.alert.ok{background:var(--ok-l);border-color:#AED9BF;color:#11512C}
.alert.warn{background:var(--warn-l);border-color:#EBD08F;color:#5F3A00}
.alert.bad{background:var(--bad-l);border-color:#F0BDB8;color:#7F1A14}
.demo{border:1px dashed #9AA7B5;background:#FAFBFC;border-radius:var(--r);padding:12px;font-size:12.5px;color:var(--mut)}
.demo b{color:var(--text)}

/* Filters */
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.fbar .field{margin:0;min-width:150px}
.fbar .grow{flex:1;min-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--text);min-height:32px}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.chip .n{opacity:.75;margin-left:4px}

/* Product */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;color:var(--text);overflow:hidden}
.pc:hover{border-color:var(--pri);box-shadow:0 2px 8px rgba(18,40,61,.1);text-decoration:none}
.pc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{font-weight:700;font-size:15px}
.pc .price{font-size:19px;font-weight:700}
.pc .specs{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line-l);padding-top:8px;margin-top:2px}
.pc .specs b{color:var(--text);font-weight:600}
.ph{margin:0;background:repeating-linear-gradient(135deg,#EEF1F5,#EEF1F5 10px,#E6EAEF 10px,#E6EAEF 20px);display:flex;flex-direction:column;align-items:center;padding:14px 10px 8px;border-bottom:1px solid var(--line-l)}
.ph svg{height:104px}
.ph figcaption{font-size:11.5px;color:var(--mut);text-align:center;margin-top:6px;line-height:1.35}
.ph.big{border:1px solid var(--line);border-radius:var(--r);padding:28px 16px 14px}
.ph.big svg{height:260px}
.ph.big figcaption{font-size:12.5px}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #7A8794;vertical-align:-2px}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.colbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:6px 12px;font:inherit;cursor:pointer;min-height:36px;color:var(--text)}
.colbtn:hover{border-color:var(--pri)}
.colbtn.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri);background:var(--pri-l);font-weight:600}
.qty{display:flex;gap:6px;align-items:center}
.qty input{width:110px;text-align:center;font-weight:600;font-size:15px}
.qty .btn{min-width:38px;padding:0 10px}
.qin{width:90px!important;text-align:right}
.pd{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px}
.bigprice{font-size:28px;font-weight:700;line-height:1.2}

/* Totals */
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0}
.tot dt{color:var(--mut)}.tot dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tot .fin{font-weight:700;font-size:17px;color:var(--text);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

/* Tracker */
.trk{display:flex;list-style:none;padding:0;margin:8px 0 0}
.trk li{flex:1;text-align:center;position:relative;padding:0 4px}
.trk li:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line)}
.trk li:first-child:before{display:none}
.trk li.done:before,.trk li.cur:before{background:var(--ok)}
.trk .dot{width:32px;height:32px;border-radius:50%;border:2px solid #AEB8C4;background:#fff;display:inline-flex;align-items:center;justify-content:center;position:relative;z-index:1;font-weight:700;color:var(--mut)}
.trk .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.trk .cur .dot{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 4px #C9DBEB}
.trk .lbl{display:block;font-weight:600;font-size:13px;margin-top:6px}
.trk .todo .lbl{color:var(--mut);font-weight:500}
.trk .dt{display:block;font-size:12px;color:var(--mut)}
.trk .now{display:inline-block;margin-top:3px;background:var(--pri);color:#fff;border-radius:10px;padding:0 8px;font-size:11.5px;font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:2px solid #fff}
.steps{display:flex;gap:8px;list-style:none;padding:0;margin:0 0 16px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--mut);font-weight:500}
.steps li i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--grey-l);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px}
.steps li.on{border-color:var(--pri);color:var(--pri);font-weight:700}
.steps li.on i{background:var(--pri);color:#fff}
.steps li.dn i{background:var(--ok);color:#fff}

/* Empty */
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty .eico{width:56px;height:56px;border-radius:50%;background:var(--grey-l);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty .eico svg{width:26px;height:26px}
.empty h2{color:var(--text);margin-bottom:4px}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.auth .left{background:var(--side);color:#C9D5E1;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between}
.auth .left h2{color:#fff;font-size:26px;line-height:1.25;margin:28px 0 12px;font-weight:700}
.auth .left ul{padding:0;list-style:none;margin:20px 0 0}
.auth .left li{display:flex;gap:10px;margin-bottom:10px}
.auth .right{padding:40px 24px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
.abox{width:100%;max-width:440px;margin-top:4vh}
.abox.wide{max-width:760px;margin-top:0}
.abox h1{margin-bottom:4px}
.big-ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.big-ic svg{width:30px;height:30px}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.dbtns .btn{justify-content:flex-start;font-weight:500;font-size:12.5px;min-height:34px;padding:0 10px;overflow:hidden;text-overflow:ellipsis}

/* Toast / modal */
#toast{position:fixed;right:20px;bottom:20px;background:#12283D;color:#fff;padding:12px 16px;border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;z-index:60;max-width:360px;font-weight:500}
#modal{position:fixed;inset:0;background:rgba(18,34,46,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .mb{background:#fff;border-radius:var(--r);padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Responsive */
@media(max-width:1000px){
  .g2,.g11,.pd{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
}
@media(max-width:820px){
  html{font-size:15px}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .shell.open .side{transform:none}
  .shell.open:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  .hamb{display:inline-flex}
  .top{padding:0 12px}.top .uname{display:none}
  .page{padding:16px 12px}
  .auth{grid-template-columns:1fr}
  .auth .left{padding:20px 16px}.auth .left .hide-m{display:none}
  .auth .right{padding:20px 12px}
  .f2,.f3{grid-template-columns:1fr}
  .trk{flex-direction:column;gap:0}
  .trk li{display:grid;grid-template-columns:32px 1fr;column-gap:12px;text-align:left;padding:0 0 18px}
  .trk li:before{left:15px;top:-100%;width:3px;height:100%}
  .trk .dot{grid-row:1/4}
  .trk .lbl{margin-top:4px}
  .dl{grid-template-columns:1fr}.dl dt{margin-top:6px}
  input[type=text],input[type=password],select,textarea{font-size:16px}
  .dbtns{grid-template-columns:1fr}
}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="mb" id="modalBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ============ DATA ============ */
const VER='hk1', TODAY='04 Oct 2026', CO='Hydrokraft GLC';
const STAGES=['Order Placed','Confirmed','In Production','Ready for Dispatch','Dispatched','Delivered'];
const AVAIL=['In Stock','Limited Stock','Made to Order','Out of Stock'];
const COL={STL:['Steel Finish','#B9C0C7'],BLK:['Matte Black','#22262B'],BLU:['Midnight Blue','#1F3A6B'],RED:['Crimson Red','#A32027'],GRN:['Forest Green','#24583C'],WHT:['Pearl White','#EDEDE8'],PNK:['Coral Pink','#E27A7A'],YLW:['Sunny Yellow','#E5B52A']};
const STATES=['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chandigarh','Chhattisgarh','Delhi','Goa','Gujarat','Haryana','Himachal Pradesh','Jammu & Kashmir','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Puducherry','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal'];
const PAYNOTE='Payment and commercial terms will be coordinated separately by our sales team.';
let S, U={}, FM={}, ER={};

function seed(){
  S={user:null,cart:[],nextOrd:1049,nextDlr:1009,lastReg:null,resetEmail:''};
  const pr=(id,name,sku,cap,wall,grade,colors,price,moq,carton,avail,stock,desc)=>({id,name,sku,cap,wall,grade,colors,price,gst:18,moq,carton,avail,stock,desc});
  S.products=[
    pr('p1','ThermoPro 500','DW-304-500',500,'Double Wall','SS 304',['STL','BLK','BLU'],345,48,24,'In Stock',null,'Vacuum-insulated bottle with a leak-proof screw cap. Keeps drinks hot for 12 hours and cold for 24 hours. Fits standard car cup holders.'),
    pr('p2','ThermoPro 750','DW-304-750',750,'Double Wall','SS 304',['STL','BLK','BLU','RED'],425,48,24,'In Stock',null,'Our best-selling vacuum-insulated bottle. Powder-coated body, leak-proof screw cap with carry loop, hot 12 hours and cold 24 hours.'),

  else if(s.step==2){body=`<div class="alert info">${ic('users')}<div>Ordering for <b>${esc(d.biz)}</b> · ${esc(d.city)}, ${d.state} · ${esc(d.contact)} ${d.mobile} — <a href="#/s/new" onclick="U.so.step=1;render();return false">Change dealer</a></div></div>
    <div class="g2"><div class="card np"><div class="ch"><h2>Products</h2><span class="mut sm">Standard dealer price, excl. GST</span></div><div class="tw"><table class="t"><thead><tr><th>Product</th><th class="r">Price</th><th>MOQ / carton</th><th>Availability</th><th>Colour</th><th>Qty (pcs)</th><th></th></tr></thead><tbody>
    ${S.products.map(p=>{const r=soRow(p.id),oos=p.avail=='Out of Stock',e=s.err[p.id];return `<tr><td><b>${esc(p.name)}</b><div class="sm mut">${p.sku} · ${capL(p.cap)} · ${p.wall}</div></td><td class="r num nw">${inr(p.price)}</td><td class="nw">${p.moq} / ${p.carton}</td><td>${avBadge(p.avail)}${p.avail=='Limited Stock'?`<div class="sm mut">${nf(p.stock)} pcs left</div>`:''}</td>
    <td><label class="sr" for="so_c_${p.id}">Colour for ${esc(p.name)}</label><select id="so_c_${p.id}" style="min-width:130px" ${oos?'disabled':''} onchange="soRow('${p.id}').c=this.value">${p.colors.map(k=>`<option value="${k}" ${r.c==k?'selected':''}>${COL[k][0]}</option>`).join('')}</select></td>
    <td><label class="sr" for="so_n_${p.id}">Quantity for ${esc(p.name)}</label><input type="text" inputmode="numeric" class="qin" id="so_n_${p.id}" value="${esc(r.q)}" placeholder="${p.moq}" ${oos?'disabled':''} oninput="soRow('${p.id}').q=this.value" onkeydown="if(event.key=='Enter')soAdd('${p.id}')">${e?`<div class="sm b" style="color:var(--bad);max-width:190px">${ic('alert')} ${e}</div>`:''}</td>
    <td class="r"><button class="btn s" ${oos?'disabled':''} onclick="soAdd('${p.id}')">Add</button></td></tr>`}).join('')}</tbody></table></div></div>
    <div class="card"><h2>Order for ${esc(d.biz)}</h2>${s.items.length?`<table class="t" style="margin:0 -4px 12px"><tbody>${soItems().map((i,n)=>`<tr><td style="padding-left:4px"><b>${esc(i.name)}</b><div class="sm mut">${COL[i.color][0]} · ${nf(i.qty)} pcs × ${inr(i.price)}</div></td><td class="r num b">${inr(i.qty*i.price)}</td><td class="r" style="padding-right:4px"><button class="btn s danger" aria-label="Remove ${esc(i.name)}" onclick="U.so.items.splice(${n},1);render()">${ic('x')}</button></td></tr>`).join('')}</tbody></table>${totBox(t)}<button class="btn pri block" style="margin-top:14px" onclick="U.so.step=3;render();window.scrollTo(0,0)">Continue to review</button>`
    :empty('cart','No products added yet.','Choose a colour, enter a quantity and press Add.')}</div></div>`}
  else{body=`<div class="g2"><div><div class="card np"><div class="ch"><h2>Products (${s.items.length})</h2><a href="#/s/new" onclick="U.so.step=2;render();return false">Edit products</a></div>${linesTable(soItems())}</div>
    <div class="card"><div class="f2">${fld('so','po','Dealer purchase order reference',{opt:1})}${fld('so','notes','Notes',{opt:1,ph:'e.g. order taken by phone'})}</div></div></div>
    <div><div class="card"><h2>Dealer and delivery</h2><p><b>${esc(d.biz)}</b><br>${esc(d.contact)} · ${d.mobile}<br><span class="mut">Ship to: ${esc(addrOf(d,'ship'))}</span></p></div>
    <div class="card"><h2>Order summary</h2>${totBox(t)}<div class="alert info" style="margin:14px 0">${ic('info')}<div><b>No online payment.</b> ${PAYNOTE}</div></div><button class="btn pri block" onclick="soSubmit()">${ic('check')}Submit order for dealer</button><button class="btn block" style="margin-top:8px" onclick="U.so.step=2;render()">Back</button></div></div></div>`}
  return shell('new',head('Create order for a dealer','Place an order on behalf of an approved dealer. It will appear in the dealer’s own order list.',s.step>1||s.items.length?`<button class="btn" onclick="U.so=null;render()">Start over</button>`:'')+steps+body)}
function soAdd(pid){const s=U.so,p=P(pid),r=soRow(pid),ex=s.items.find(i=>i.pid==pid&&i.color==r.c),e=qtyErr(p,r.q,ex?ex.qty:0);
  if(e){s.err[pid]=e;render();return}
  if(ex)ex.qty+=+r.q;else s.items.push({pid,color:r.c,qty:+r.q});delete s.err[pid];toast('Added: '+r.q+' × '+p.name);r.q='';render()}
function soSubmit(){const s=U.so,o=newOrder(s.dealer,soItems(),{po:s.po.trim(),notes:s.notes.trim(),by:who()});U.so=null;go('/s/confirm/'+o.id)}
function vSalesConfirm(id){const o=O(id);return o?shell('new',confirmBody(o,'sales')):v404()}

/* ============ FACTORY / DISPATCH ============ */
const FQ=['Confirmed','In Production','Ready for Dispatch','Dispatched'];
function vFactory(arg){if(arg!=null){U.fq=FQ[arg]||FQ[0];go('/f/dashboard');return null}
  const tab=U.fq=U.fq||'Confirmed',by=s=>sortO(S.orders.filter(o=>o.status==s)).reverse(),l=by(tab),lab=['To start','In production','Ready for dispatch','Dispatched (in transit)'];
  return shell('dashboard',head('Production queue','Confirmed orders, oldest first. Open an order to update its stage.')+
  `<div class="g4">${FQ.map((s,i)=>kpi(lab[i],by(s).length,i==0?'Confirmed, waiting for production ›':'View ›','/f/dashboard/'+i)).join('')}</div>
  <div class="chips" role="group" aria-label="Stage">${FQ.map(s=>`<button class="chip ${s==tab?'on':''}" aria-pressed="${s==tab}" onclick="U.fq='${s}';render()">${s}<span class="n">${by(s).length}</span></button>`).join('')}</div>
  <div class="card np">${l.length?ordersTable(l,'factory'):empty('check','No orders at this stage.','Orders will appear here as they move through production and dispatch.')}</div>`)}
function vReq(){const m={};S.orders.filter(o=>o.status=='Confirmed'||o.status=='In Production').forEach(o=>o.items.forEach(i=>{const r=m[i.sku]||(m[i.sku]={i,qty:0,ords:[],prod:0});r.qty+=i.qty;r.ords.push(o.id);if(o.status=='In Production')r.prod+=i.qty}));
  const l=Object.values(m).sort((a,b)=>a.i.sku.localeCompare(b.i.sku));
  return shell('requirements',head('Production requirements','Total quantities needed across orders that are Confirmed or In Production.')+
  `<div class="card np">${l.length?`<div class="tw"><table class="t"><thead><tr><th>Product</th><th>SKU</th><th>Colour</th><th class="r">Pieces required</th><th class="r">Cartons</th><th class="r">Already in production</th><th>Orders</th></tr></thead><tbody>${l.map(r=>`<tr><td><b>${esc(r.i.name)}</b><div class="sm mut">${capL(r.i.cap)}</div></td><td class="nw">${esc(r.i.sku)}</td><td class="nw"><span class="sw" style="background:${COL[r.i.color][1]}"></span> ${COL[r.i.color][0]}</td><td class="r num b">${nf(r.qty)}</td><td class="r num">${nf(Math.ceil(r.qty/r.i.carton))}</td><td class="r num">${nf(r.prod)}</td><td>${r.ords.map(id=>`<a href="#/f/order/${id}">${id}</a>`).join(', ')}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="3">Total</td><td class="r num">${nf(l.reduce((a,r)=>a+r.qty,0))}</td><td class="r num">${nf(l.reduce((a,r)=>a+Math.ceil(r.qty/r.i.carton),0))}</td><td class="r num">${nf(l.reduce((a,r)=>a+r.prod,0))}</td><td></td></tr></tfoot></table></div>`:empty('check','Nothing is waiting for production.','Confirmed orders will be listed here by product and colour.')}</div>`)}
function vDone(){const l=sortO(S.orders.filter(o=>o.status=='Delivered'));return shell('completed',head('Completed orders','Orders that have been delivered.')+`<div class="card np">${l.length?ordersTable(l,'factory'):empty('truck','No delivered orders yet.','Orders appear here once they are marked delivered.')}</div>`)}

/* ============ ROUTER ============ */
const R={'login':vLogin,'register':vRegister,'register/submitted':vRegDone,'status':vStatus,'forgot':vForgot,'forgot/sent':vForgotSent,'reset':vReset,'reset/done':vResetDone,
  'd/dashboard':vDash,'d/catalogue':vCatalogue,'d/product':vProduct,'d/cart':vCart,'d/review':vReview,'d/confirm':vConfirm,'d/orders':vOrders,'d/order':vOrder,'d/profile':vProfile,
  'a/dashboard':vAdminDash,'a/dealers':vDealers,'a/dealer':vDealer,'a/products':vProducts,'a/product':vProductForm,'a/orders':vOrders,'a/order':vOrder,
  's/dashboard':vSalesDash,'s/new':vSalesNew,'s/confirm':vSalesConfirm,'s/dealers':vDealers,'s/dealer':vDealer,'s/orders':vOrders,'s/order':vOrder,'s/products':vCatalogue,
  'f/dashboard':vFactory,'f/requirements':vReq,'f/completed':vDone,'f/order':vOrder};
function route(seg){const role={d:'dealer',a:'admin',s:'sales',f:'factory'}[seg[0]];
  if(role){if(!S.user){go('/login');return null}if(S.user.role!=role){go(HOME[S.user.role]);return null}if(role=='dealer'&&me().status!='Approved'){go('/status');return null}
    const fn=R[seg[0]+'/'+seg[1]];return fn?fn(seg[2]):v404()}
  if(seg[0]=='status'&&!me()){go('/login');return null}
  const fn=R[seg.join('/')];return fn?fn():v404()}
function render(){const ae=document.activeElement,fid=ae&&ae.id;let pos=null;try{pos=ae.selectionStart}catch(e){}
  const html=route((location.hash.slice(1)||'/login').split('/').filter(Boolean));if(html==null)return;
  $('#app').innerHTML=html;
  if(fid){const el=document.getElementById(fid);if(el&&el.tagName!='MAIN'){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
  save()}
window.addEventListener('hashchange',()=>{ER={};U.menu=false;closeModal();render();window.scrollTo(0,0)});
if(!load())seed();
render();
</script>
</body>
</html>
